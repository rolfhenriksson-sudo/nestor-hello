name: Kör hello.py
on:
  push:
  workflow_dispatch:
jobs:
  kor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python hello.py
      - run: pip install pytest
      - run: pytest -v
